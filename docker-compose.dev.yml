services:
  car-minder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car-minder-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - car_minder_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl -f http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  car_minder_data:
    driver: local
