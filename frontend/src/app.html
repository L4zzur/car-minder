<!doctype html>

<html lang="%paraglide.lang%" class="dark" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#09090b" />
		<meta name="color-scheme" content="dark" />

		<!-- Primary Meta Tags -->
		<title>car minder — garage, mileage, and maintenance tracker</title>
		<meta name="title" content="car minder — garage, mileage, and maintenance tracker" />
		<meta
			name="description"
			content="Open-source, self-hosted web app and Telegram companion for your garage. Digital service book, mileage tracking, and timely maintenance reminders."
		/>

		<!-- Open Graph / Facebook / Telegram -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="car minder — garage, mileage, and maintenance tracker" />
		<meta
			property="og:description"
			content="open-source, self-hosted web app and telegram companion for your garage. digital service book, mileage tracking, and timely maintenance reminders."
		/>
		<meta property="og:image" content="/og-banner.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="car minder banner" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="car minder — garage, mileage, and maintenance tracker" />
		<meta
			name="twitter:description"
			content="open-source, self-hosted web app and telegram companion for your garage. digital service book, mileage tracking, and timely maintenance reminders."
		/>
		<meta name="twitter:image" content="/og-banner.png" />
		<meta name="twitter:image:alt" content="car minder banner" />

		<!-- Favicons & Icons -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="alternate icon" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
